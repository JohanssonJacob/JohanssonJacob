    <ellipse rx="157" ry="57" transform="rotate(38)" fill="none" stroke="#353943" stroke-width="2"/>
    <text x="0" y="16" text-anchor="middle" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="66" letter-spacing="-7" fill="#f4f3ed">&lt;/&gt;</text>
    <circle cx="125" cy="-79" r="11" fill="#d8f582"/>
    <circle cx="-122" cy="-73" r="8" fill="#b8a7f5"/>
    <circle cx="-103" cy="106" r="5" fill="#d8f582"/>
