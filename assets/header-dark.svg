<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Jacob Johansson — Java roots. Frontend focus.</title>
  <desc id="desc">Java development graduate and frontend student. An orbital illustration connects backend and frontend development.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#353943"/></pattern>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8a7f5"/><stop offset="1" stop-color="#d8f582"/></linearGradient>
  </defs>
  <rect width="1200" height="440" rx="22" fill="#111318"/>
  <rect x="780" y="20" width="400" height="400" fill="url(#grid)"/>
  <path d="M48 91H1152" stroke="#353943"/>
  <text x="48" y="59" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" fill="#f4f3ed">Jacob Johansson</text>
  <text x="1152" y="57" text-anchor="end" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" fill="#a8adb9">@JohanssonJacob</text>
  <text x="48" y="195" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-3" fill="#f4f3ed">Java roots.</text>
  <text x="48" y="280" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-3" fill="#d8f582">Frontend focus.</text>
  <rect x="48" y="326" width="5" height="52" rx="2" fill="#d8f582"/>
  <text x="70" y="347" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#f4f3ed">Java development graduate</text>
  <text x="70" y="376" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#a8adb9">Frontend student at Nackademin</text>
  <g transform="translate(970 253)">
    <circle r="118" fill="#191c24" stroke="#353943"/>
    <circle r="93" fill="none" stroke="#353943" stroke-dasharray="3 9"/>
